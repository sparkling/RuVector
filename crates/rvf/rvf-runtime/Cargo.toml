[package]
name = "rvf-runtime"
version = "0.2.0"
edition = "2021"
description = "RuVector Format runtime -- RvfStore API, compaction, and streaming I/O"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruvector"
homepage = "https://github.com/ruvnet/ruvector"
readme = "README.md"
categories = ["database-implementations", "data-structures"]
keywords = ["vector", "database", "storage", "compaction", "rvf"]
rust-version = "1.87"

[features]
default = ["std"]
std = []
wasm = []
qr = []
ed25519 = ["rvf-types/ed25519"]

[dependencies]
rvf-types = { version = "0.2.0", path = "../rvf-types", features = ["std"] }

# ADR-0275: RVF-native HNSW Layer B. The index kit is zero-external-dep and
# defines its own VectorStore trait + HnswGraph; the runtime adapts its
# VectorData over it and persists the graph via a witnessed INDEX_SEG.
rvf-index = { version = "0.1.0", path = "../rvf-index", default-features = false, features = ["std"] }

# ADR-0167 Phase 1 (2026-05-10): RootHeader atomic root pointer +
# F_BARRIERFSYNC/F_FULLFSYNC durability helpers. Per
# Amendment 2026-05-10d we deliberately do NOT add `fs2` (DA-1: 8-years
# stagnant; keep `libc::flock` for Phase 1 and defer `fd-lock` to ADR-0168).
crc32fast = "1.4"
zerocopy = { version = "0.7", features = ["derive"] }

# ADR-0095 amendment (2026-05-01): kernel flock-based WriterLock needs libc
# for `open`/`close`/`flock` syscalls. Same crate already used by rvf-node's
# IngestLockGuard, so version-pinning is consistent across the workspace.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[[example]]
name = "qr_seed_encode"
required-features = ["qr"]

# ADR-0167 Phase 1: worker helper for cross-process stress tests
# (`tests/adr0167_n8_stress.rs`). The integration test references this via
# `env!("CARGO_BIN_EXE_rvf_test_writer")`, which cargo populates
# automatically when running `cargo test`.
[[bin]]
name = "rvf_test_writer"
path = "src/bin/rvf_test_writer.rs"
test = false
bench = false
doc = false
